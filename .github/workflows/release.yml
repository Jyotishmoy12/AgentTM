name: Release archives
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v
        required: true
        default: '0.3.1'
permissions:
  contents: write
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test ./...
      - run: go vet ./...
      - name: Build verified archives
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          go run ./cmd/release --version "$version"
          cp scripts/install.ps1 scripts/install.sh dist/
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-desktop-preview
          path: dist/
      - name: Verify combined release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha256sum dist/agenttm-desktop_*.zip | sed 's|  dist/|  |' >> dist/SHA256SUMS
          go run ./cmd/release --verify-only --require-all-targets --desktop-windows --version "$REQUESTED_VERSION" --out dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          tag="v$version"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "AgentTM $version" \
            --generate-notes
