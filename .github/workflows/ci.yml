name: CI
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.3.1'
env:
  RELEASE_VERSION: ${{ inputs.version || '0.3.1' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test ./...
      - run: node scripts/check-docs.mjs
      - run: go vet ./...
      - run: go test -race ./internal/storage ./internal/fork ./internal/server
        if: runner.os == 'Linux'
      - run: go build -o bin/agenttm ./cmd/agenttm
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
        working-directory: web
      - run: npm run test:e2e
        if: runner.os == 'Linux'
        working-directory: web
      - name: Package native archive
        shell: bash
        run: |
          desktop_flag=""
          if [[ "$(go env GOOS)" == windows ]]; then desktop_flag="--desktop-windows"; fi
          go run ./cmd/release --version "$RELEASE_VERSION" --targets "$(go env GOOS)/$(go env GOARCH)" $desktop_flag --out dist/native
          go run ./cmd/release --verify-only --version "$RELEASE_VERSION" --out dist/native
      - name: Install Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-install.ps1 -AssetDir dist/native -Version $env:RELEASE_VERSION -TestUserPath
          $cli = Join-Path $env:RUNNER_TEMP 'agenttm-cli-smoke'
          Expand-Archive "dist/native/agenttm_$($env:RELEASE_VERSION)_windows_amd64.zip" $cli
          node scripts/smoke-ui.mjs (Join-Path $cli 'agenttm.exe') $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Packaged UI smoke failed.' }
          ./scripts/test-desktop.ps1 -Archive "dist/native/agenttm-desktop_$($env:RELEASE_VERSION)_windows_amd64.zip" -Version $env:RELEASE_VERSION
          ./scripts/test-desktop.ps1 -Archive "dist/native/agenttm-desktop_$($env:RELEASE_VERSION)_windows_amd64.zip" -Version $env:RELEASE_VERSION -ExpectWelcome
      - name: Install Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n scripts/install.sh
          sh -n scripts/test-install.sh
          sh scripts/test-install.sh dist/native "$RELEASE_VERSION" "$(go env GOOS)_$(go env GOARCH)"
          sh scripts/install.sh dist/native/*.tar.gz "$RUNNER_TEMP/agenttm-ui-installed"
          node scripts/smoke-ui.mjs "$RUNNER_TEMP/agenttm-ui-installed/agenttm" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-desktop-preview
          path: dist/native/agenttm-desktop_*.zip
          if-no-files-found: error
